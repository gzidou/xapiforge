# GitHub Actions: PR checks + push validation
#
# 3 parallel jobs:
#   1. lint    — ESLint strict mode
#   2. format  — Prettier check
#   3. build   — packages build + root scripts tsc
#
# Toolchain:
#   - pnpm 9 + Node 24 LTS
#   - Cached pnpm store (lockfile hash key)

name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

# 取消同一分支上旧的 in-progress run（节省 CI 配额）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ---------- 1. ESLint 严格检查 ----------
  lint:
    name: Lint (ESLint strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the exact version from package.json#packageManager.
      # Do not repeat it here: v4 rejects multiple version sources.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  # ---------- 2. Prettier check ----------
  format:
    name: Format (Prettier check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  # ---------- 3. 6 packages build ----------
  build:
    name: Build (6 packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Typecheck root scripts
        run: npx tsc --noEmit
